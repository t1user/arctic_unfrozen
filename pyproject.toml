[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arctic_refrozen"
version = "1.83.1"
description = "Versioned TimeSeries and Tick store forked from AHL Research's Arctic"
dynamic = ["readme"]
requires-python = ">=3.10"
license = {text = "LGPL-2.1-or-later"}
authors = [
  {name = "Man AHL Technology", email = "arctic@man.com"},
  {name="t1user", email = "enterdragon@duck.com"},
]
keywords = ["ahl", "keyvalue", "tickstore", "mongo", "timeseries"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "decorator",
    "pandas",
    "numpy",
    "python-dateutil",
    "pymongo<4",
    "pytz",
    "tzlocal",
    "lz4",
]

[project.optional-dependencies]
test = [
    "mock",
    "mockextras",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
]
tests = [
    "mock",
    "mockextras",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
]
dev = [
    "black",
    "flake8",
    "mypy",
    "nox",
]

[project.urls]
Homepage = "https://github.com/t1user/arctic_refrozen"

[project.scripts]
arctic_init_library = "arctic.scripts.arctic_init_library:main"
arctic_list_libraries = "arctic.scripts.arctic_list_libraries:main"
arctic_delete_library = "arctic.scripts.arctic_delete_library:main"
arctic_enable_sharding = "arctic.scripts.arctic_enable_sharding:main"
arctic_copy_data = "arctic.scripts.arctic_copy_data:main"
arctic_create_user = "arctic.scripts.arctic_create_user:main"
arctic_prune_versions = "arctic.scripts.arctic_prune_versions:main"
arctic_fsck = "arctic.scripts.arctic_fsck:main"

[tool.setuptools.dynamic]
readme = {file = ["README.md", "CHANGES.md"], content-type = "text/markdown"}

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "benchmarks"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.flake8]
extend-ignore = ["E122", "E126", "E501", "E731", "W503", "E722", "W504"]
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".nox",
    ".tox",
    ".venv",
    "build",
    "dist",
    "htmlcov",
]

[tool.mypy]
python_version = "3.10"
packages = ["arctic"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "arctic.arctic",
    "arctic.chunkstore._chunker",
    "arctic.chunkstore.date_chunker",
    "arctic.chunkstore.passthrough_chunker",
    "arctic.chunkstore.tools.tools",
    "arctic.chunkstore.utils",
    "arctic._cache",
    "arctic._compression",
    "arctic._util",
    "arctic.asynchronous._workers_pool",
    "arctic.asynchronous.async_arctic",
    "arctic.auth",
    "arctic.asynchronous.async_utils",
    "arctic.date._daterange",
    "arctic.date._generalslice",
    "arctic.date._parse",
    "arctic.date._util",
    "arctic.decorators",
    "arctic.fixtures.arctic",
    "arctic.hooks",
    "arctic.hosts",
    "arctic.multi_index",
    "arctic.scripts.arctic_copy_data",
    "arctic.scripts.arctic_create_user",
    "arctic.scripts.arctic_delete_library",
    "arctic.scripts.arctic_enable_sharding",
    "arctic.scripts.arctic_fsck",
    "arctic.scripts.arctic_init_library",
    "arctic.scripts.arctic_list_libraries",
    "arctic.scripts.arctic_prune_versions",
    "arctic.scripts.utils",
    "arctic.serialization.incremental",
    "arctic.serialization.numpy_arrays",
    "arctic.serialization.numpy_records",
    "arctic.serialization._serializer",
    "arctic.store.audit",
    "arctic.store.bitemporal_store",
    "arctic.store.bson_store",
    "arctic.store.metadata_store",
    "arctic.store._ndarray_store",
    "arctic.store._pandas_ndarray_store",
    "arctic.store._pickle_store",
    "arctic.store._version_store_utils",
    "arctic.store.versioned_item",
    "arctic.tickstore.tickstore",
    "arctic.tickstore.toplevel",
]
disallow_untyped_defs = true
