[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arctic_unfrozen"
version = "1.83.1"
description = "Versioned TimeSeries and Tick store forked from AHL Research's Arctic"
dynamic = ["readme"]
requires-python = ">=3.10"
license = {text = "LGPL-2.1-or-later"}
authors = [
  {name = "Man AHL Technology", email = "arctic@man.com"},
  {name="t1user", email = "enterdragon@duck.com"},
]
keywords = ["ahl", "finance", "keyvalue", "market-data", "mongo", "timeseries", "tickstore", "trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "decorator",
    "pandas",
    "numpy",
    "python-dateutil",
    "pymongo>=4.17,<5",
    "tzdata; platform_system == 'Windows'",
    "tzlocal",
    "lz4",
]

[project.optional-dependencies]
test = [
    "mock",
    "mockextras",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
]
tests = [
    "mock",
    "mockextras",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
]
dev = [
    "black",
    "flake8",
    "mypy",
    "nox",
]

[project.urls]
Homepage = "https://github.com/t1user/arctic_unfrozen"

[project.scripts]
arctic_init_library = "arctic.scripts.arctic_init_library:main"
arctic_list_libraries = "arctic.scripts.arctic_list_libraries:main"
arctic_delete_library = "arctic.scripts.arctic_delete_library:main"
arctic_enable_sharding = "arctic.scripts.arctic_enable_sharding:main"
arctic_copy_data = "arctic.scripts.arctic_copy_data:main"
arctic_create_user = "arctic.scripts.arctic_create_user:main"
arctic_prune_versions = "arctic.scripts.arctic_prune_versions:main"
arctic_fsck = "arctic.scripts.arctic_fsck:main"

[tool.setuptools.dynamic]
readme = {file = ["README.md", "CHANGES.md"], content-type = "text/markdown"}

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "benchmarks"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
packages = ["arctic"]
ignore_missing_imports = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
