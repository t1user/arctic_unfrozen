[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.flake8]
extend-ignore = ["E122", "E126", "E501", "E731", "W503", "E722", "W504"]
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "htmlcov",
]

[tool.mypy]
python_version = "3.10"
packages = ["arctic"]
ignore_missing_imports = true
warn_unused_ignores = true
