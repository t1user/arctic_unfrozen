[metadata]
name = arctic

[pycodestyle]
max-line-length = 88
# Keep E501 ignored until legacy formatting is migrated incrementally.
ignore = E122,E126,E203,E501,E701,E731,W503,E722,W504

[flake8]
max-line-length = 88
# Keep E501 ignored until legacy formatting is migrated incrementally.
extend-ignore = E122,E126,E203,E501,E701,E731,W503,E722,W504
exclude =
    .eggs,
    .git,
    .mypy_cache,
    .pytest_cache,
    .ruff_cache,
    .nox,
    .tox,
    .venv,
    build,
    dist,
    htmlcov,
